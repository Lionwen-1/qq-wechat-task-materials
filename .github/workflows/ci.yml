name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: chat-task-bridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13.18'
          cache: pip
          cache-dependency-path: chat-task-bridge/requirements-lock-windows-py313.txt
      - name: Install pinned dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all:
          -r requirements-lock-windows-py313.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Synthetic unit tests
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Official MCP handshake and denied scope
        run: python smoke_mcp.py
      - name: Public source checks
        working-directory: .
        run: python tools/check_public_export.py
      - name: Unbound skill launcher status
        run: |
          $runtimePath = Join-Path $env:RUNNER_TEMP 'chat-bridge-runtime.json'
          @{
            python = (Get-Command python).Source
            bridge_root = (Get-Location).Path
            config = (Join-Path (Get-Location).Path 'config.example.json')
          } | ConvertTo-Json | Set-Content -Encoding utf8 $runtimePath
          python ../qq-wechat-task-materials/scripts/chat_materials.py --runtime $runtimePath status
